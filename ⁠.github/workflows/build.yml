name: Build Rahor Sentinel Windows Executable

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name="RahorSentinel" sentinel_core.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RahorSentinel-Windows-Executable
        path: dist/RahorSentinel.exe
